<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f6f7f3"><meta name="description" content="A calm, simple place to keep your day moving.">
  <title>Daymark — your daily list</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{font-family:'DM Sans',sans-serif;color:#20231f;background:#f6f7f3;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 82% 2%,#e9efdf 0,transparent 31%),#f6f7f3}.shell{width:min(100% - 40px,900px);margin:auto}.topbar{height:78px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e7e9e2}.brand{display:flex;align-items:center;gap:10px;font:800 20px Manrope,sans-serif;letter-spacing:-.8px}.mark{width:29px;height:29px;border-radius:10px;background:#234e3e;color:#fff;display:grid;place-items:center;font-size:16px}.today{font-size:13px;color:#788078}.hero{padding:57px 0 35px;max-width:600px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:1.8px;font-weight:700;color:#69836d}.hero h1{font:700 clamp(36px,6vw,54px)/1.09 Manrope,sans-serif;letter-spacing:-2.7px;margin:13px 0 12px}.hero p{color:#7a8079;margin:0;font-size:15px}.card{background:#fff;border:1px solid #e9ebe5;border-radius:20px;padding:23px;box-shadow:0 14px 38px #2738290a}.add{display:flex;gap:11px}.add input{flex:1;min-width:0;border:1px solid #e4e7df;background:#fbfcf9;padding:14px 15px;border-radius:11px;font:inherit;outline:none;transition:.2s}.add input:focus{border-color:#73977c;box-shadow:0 0 0 3px #73977c1c}.add button{border:0;border-radius:11px;padding:0 20px;background:#234e3e;color:white;font:600 14px inherit;cursor:pointer;transition:.2s}.add button:hover{background:#183c2e;transform:translateY(-1px)}.toolbar{display:flex;align-items:center;justify-content:space-between;margin:24px 1px 12px}.filters{display:flex;gap:5px}.filter{border:0;background:transparent;padding:8px 12px;border-radius:8px;color:#858b83;font:600 13px inherit;cursor:pointer}.filter.active{background:#eaf0e8;color:#2d5a3b}.remaining{font-size:12px;color:#8b9089}.list{display:grid;gap:9px}.todo{display:flex;align-items:center;gap:13px;border:1px solid #eceee8;border-radius:12px;padding:14px 14px;transition:.18s}.todo:hover{border-color:#dce3d9;background:#fdfefc}.check{width:21px;height:21px;border:1.5px solid #d2d8ce;border-radius:7px;background:#fff;display:grid;place-items:center;flex:none;cursor:pointer;color:white}.todo.done .check{background:#497257;border-color:#497257}.check svg{width:13px;height:13px}.title{flex:1;min-width:0;overflow-wrap:anywhere;font-size:14px}.todo.done .title{text-decoration:line-through;color:#a3a9a1}.delete{border:0;background:transparent;color:#a9afa7;font-size:19px;cursor:pointer;width:30px;height:30px;border-radius:8px}.delete:hover{background:#fbeceb;color:#b4524a}.empty{padding:40px 12px;text-align:center;color:#92988f;font-size:14px}.empty strong{display:block;color:#4e5a4d;font-size:15px;margin-bottom:6px}.footer{padding:19px 3px 30px;color:#a2a79f;font-size:12px;text-align:center}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,15px);opacity:0;background:#202b23;color:white;padding:11px 16px;border-radius:10px;font-size:13px;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:560px){.shell{width:min(100% - 28px,900px)}.topbar{height:67px}.today{font-size:11px}.hero{padding:43px 0 27px}.card{padding:16px;border-radius:16px}.add{gap:8px}.add input{padding:13px 11px;font-size:14px}.add button{padding:0 14px}.toolbar{margin-top:20px}.todo{padding:12px 10px}}
  </style>
</head>
<body><div class="shell"><header class="topbar"><div class="brand"><span class="mark">✓</span>daymark</div><div class="today" id="date"></div></header><main><section class="hero"><div class="eyebrow">A little clarity, every day</div><h1>Make room for<br>what matters.</h1><p>One thing at a time. You’ve got this.</p></section><section class="card" aria-label="Todo list"><form class="add" id="add-form"><input id="new-title" type="text" maxlength="200" placeholder="What needs your attention?" aria-label="New todo" required><button type="submit">Add task <span aria-hidden="true">＋</span></button></form><div class="toolbar"><nav class="filters" aria-label="Filter tasks"><button class="filter active" data-filter="all">All</button><button class="filter" data-filter="active">To do</button><button class="filter" data-filter="completed">Done</button></nav><span class="remaining" id="remaining"></span></div><div class="list" id="list" aria-live="polite"></div></section></main><footer class="footer">Small steps still move you forward.</footer></div><div class="toast" id="toast" role="status"></div>
<script>
const list=document.querySelector('#list'),form=document.querySelector('#add-form'),input=document.querySelector('#new-title'),remaining=document.querySelector('#remaining'),toast=document.querySelector('#toast');let todos=[],filter='all';document.querySelector('#date').textContent=new Intl.DateTimeFormat(undefined,{weekday:'short',month:'short',day:'numeric'}).format(new Date());
async function request(path,options={}){const r=await fetch('/api/todos'+path,{...options,headers:{'Content-Type':'application/json',...options.headers}});if(!r.ok){const body=await r.json().catch(()=>({}));throw new Error(body.error||'Something went wrong. Please try again.')}return r.status===204?null:r.json()}
function notify(message){toast.textContent=message;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2400)}function render(){const visible=todos.filter(t=>filter==='all'||(filter==='active'&&!t.completed)||(filter==='completed'&&t.completed));remaining.textContent=`${todos.filter(t=>!t.completed).length} left`;list.innerHTML=visible.length?'':`<div class="empty"><strong>${filter==='completed'?'Nothing completed just yet.':filter==='active'?'You’re all caught up.':'Your list is a blank canvas.'}</strong>${filter==='active'?'Enjoy the breathing room.':'Add a task above to get started.'}</div>`;visible.forEach(todo=>{const row=document.createElement('div');row.className='todo'+(todo.completed?' done':'');const check=document.createElement('button');check.className='check';check.setAttribute('aria-label',todo.completed?'Mark task active':'Mark task complete');if(todo.completed)check.innerHTML='<svg viewBox="0 0 16 16" fill="none"><path d="m3 8 3.2 3.2L13 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';check.onclick=()=>change(todo.id,{completed:!todo.completed});const title=document.createElement('span');title.className='title';title.textContent=todo.title;const del=document.createElement('button');del.className='delete';del.setAttribute('aria-label','Delete task');del.textContent='×';del.onclick=()=>remove(todo.id);row.append(check,title,del);list.append(row)})}
async function load(){try{todos=await request('');render()}catch(e){notify(e.message)}}async function change(id,data){try{const updated=await request('/'+id,{method:'PATCH',body:JSON.stringify(data)});todos=todos.map(t=>t.id===id?updated:t);render()}catch(e){notify(e.message)}}async function remove(id){try{await request('/'+id,{method:'DELETE'});todos=todos.filter(t=>t.id!==id);render()}catch(e){notify(e.message)}}form.onsubmit=async e=>{e.preventDefault();const title=input.value.trim();if(!title)return;try{const todo=await request('',{method:'POST',body:JSON.stringify({title})});todos.unshift(todo);input.value='';render();input.focus()}catch(e){notify(e.message)}};document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()});load();
</script></body></html>
